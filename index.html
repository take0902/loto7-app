<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10233f"><title>ロト6・ロト7 AI Engine Ver.2.1</title><style>
:root{--navy:#10233f;--blue:#2f75b5;--green:#2f7d50;--purple:#6f42c1;--bg:#f3f6f9;--card:#fff;--text:#18212f;--muted:#667085;--line:#dfe5ec;--gold:#fff4ce;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Meiryo",sans-serif}header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--navy),#214e80);color:#fff;padding:16px 14px 12px;box-shadow:0 2px 12px rgba(0,0,0,.18)}header h1{font-size:20px;margin:0}header p{margin:3px 0 0;font-size:12px;opacity:.86}.game-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.game-switch button{border:1px solid rgba(255,255,255,.45);border-radius:12px;padding:10px;background:rgba(255,255,255,.10);color:#fff;font-weight:800}.game-switch button.active{background:#fff;color:var(--navy)}main{max-width:920px;margin:auto;padding:12px 12px 92px}nav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}nav button{border:0;border-radius:12px;padding:10px 4px;background:#fff;color:#344054;font-size:11px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}nav button.active{background:var(--navy);color:#fff}section{display:none}section.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 2px 8px rgba(16,35,63,.06)}h2{font-size:18px;margin:2px 0 10px}h3{font-size:15px;margin:4px 0 8px}.muted{color:var(--muted);font-size:12px}.notice{background:var(--gold);border-left:4px solid #d6a700;padding:11px;border-radius:8px;font-size:12px}.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.kpi div{background:#f7f9fc;border-radius:12px;padding:12px}.kpi b{display:block;font-size:21px}.kpi span{font-size:11px;color:var(--muted)}.set{border:1px solid var(--line);border-radius:14px;padding:12px;margin:9px 0}.set-head{display:flex;justify-content:space-between;align-items:center}.balls{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.ball{display:inline-flex;width:36px;height:36px;align-items:center;justify-content:center;border-radius:50%;background:#fff;border:2px solid var(--blue);font-weight:800}.loto7 .ball{border-color:var(--purple)}.badge{display:inline-block;border-radius:99px;padding:3px 8px;font-size:11px;font-weight:700;background:#e8f1fa;color:#194f7e}button.primary,button.secondary{width:100%;padding:13px;border:0;border-radius:12px;font-size:15px;font-weight:800;margin-top:8px}button.primary{background:var(--green);color:#fff}button.secondary{background:#e9eef4;color:#24364d}input,textarea{width:100%;padding:11px;border:1px solid #cfd8e3;border-radius:10px;background:#fff;font-size:16px}label{display:block;font-size:12px;font-weight:700;margin:9px 0 4px}table{width:100%;border-collapse:collapse;font-size:12px}.scroll{overflow-x:auto}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}th{background:#f6f8fb;position:sticky;top:0}.rankbar{height:7px;background:#e8edf3;border-radius:99px;overflow:hidden}.rankbar i{display:block;height:100%;background:var(--blue)}.good{color:var(--green);font-weight:800}.bad{color:var(--red);font-weight:800}footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));font-size:10px;color:var(--muted);text-align:center}@media(min-width:700px){.kpi{grid-template-columns:repeat(4,1fr)}nav button{font-size:13px}}
</style></head><body><header><h1>ロト6・ロト7 AI Engine Ver.2.1</h1><p>1つのアプリで予想・検証・ランキングを管理</p><div class="game-switch"><button id="switch6" class="active">ロト6</button><button id="switch7">ロト7</button></div></header><main><nav><button class="active" data-tab="home">ホーム</button><button data-tab="predict">次回予想</button><button data-tab="verify">検証</button><button data-tab="ranking">ランキング</button><button data-tab="settings">設定</button></nav>
<section id="home" class="active"><div class="card"><h2 id="homeTitle"></h2><div class="kpi"><div><b>2.1</b><span>統合版</span></div><div><b id="kpiRange"></b><span>使用数字</span></div><div><b id="kpiPick"></b><span>本数字</span></div><div><b id="kpiBonus"></b><span>ボーナス</span></div></div></div><div class="card"><h3>保存状態</h3><p id="statusText"></p></div><div class="notice">各組み合わせの1等確率は理論上同じです。本アプリのスコアは買い目の構成・分散を比較する研究用指標です。</div></section>
<section id="predict"><div class="card"><h2 id="predictTitle"></h2><p class="muted">最新入力データとセット間多様性を使って生成します。</p><div id="sets"></div><button class="primary" id="generateBtn">5セットを再生成</button><button class="secondary" id="savePredictionBtn">今回の購入セットとして保存</button></div></section>
<section id="verify"><div class="card"><h2 id="verifyTitle"></h2><label>回号</label><input id="drawNo" type="number" placeholder="例：2123"><label id="winningLabel"></label><input id="winningNums"><label id="bonusLabel"></label><input id="bonusNum"><button class="primary" id="verifyBtn">購入5セットと照合</button></div><div id="verifyResult"></div><div class="card"><h3>検証履歴</h3><div class="scroll"><table><thead><tr><th>回号</th><th>最高一致</th><th>前回重複</th><th>±1</th><th>B隣接</th><th>合計</th><th>AC</th></tr></thead><tbody id="historyBody"></tbody></table></div></div></section>
<section id="ranking"><div class="card"><h2 id="rankingTitle"></h2><div class="scroll"><table><thead><tr><th>順位</th><th>数字</th><th>スコア</th><th>比較</th></tr></thead><tbody id="rankingBody"></tbody></table></div></div></section>
<section id="settings"><div class="card"><h2 id="settingsTitle"></h2><p class="muted">ロト6・ロト7で別々に保存されます。</p><div id="featureSettings"></div><button class="primary" id="saveSettingsBtn">設定を保存</button><button class="secondary" id="resetBtn">現在のゲームだけ初期設定に戻す</button></div><div class="card"><h3>データ管理</h3><button class="secondary" id="exportBtn">両方のデータをJSONで書き出す</button><label>JSONデータを読み込む</label><textarea id="importText" rows="5"></textarea><button class="secondary" id="importBtn">読み込む</button></div></section></main><footer>ロト6・ロト7統合版 | 端末内保存・オフライン対応</footer>
<script>
const BASE6={1:16.03,2:14.72,3:12.44,4:6.10,5:17.28,6:8.82,7:8.55,8:17.03,9:5.76,10:3.87,11:7.04,12:5.73,13:5.57,14:6.87,15:6.56,16:7.56,17:6.73,18:12.01,19:6.39,20:11.96,21:9.81,22:4.56,23:6.81,24:3.50,25:3.49,26:7.35,27:11.30,28:7.12,29:3.55,30:8.06,31:8.25,32:8.48,33:6.76,34:8.04,35:17.23,36:15.78,37:10.88,38:10.51,39:4.95,40:12.15,41:7.85,42:13.97,43:10.98};
const BASE7=Object.fromEntries(Array.from({length:37},(_,i)=>[i+1,10]));const WEIGHTS={recent:.8,slide:1.6,previous:.4,bonusAdj:.5,sum:1,oddEven:1,ac:.2,diversity:2};
const DEFAULTS={loto6:{name:"ロト6",max:43,pick:6,bonusCount:1,base:BASE6,latest:[12,15,18,21,26,32],latestBonus:[41],recent:[[3,8,13,14,16,43],[1,3,10,17,25,26],[12,15,18,21,26,32]],weights:{...WEIGHTS},purchased:[[1,5,8,35,36,42],[2,5,20,27,35,40],[3,8,18,20,35,43],[1,3,18,27,36,40],[2,8,18,21,27,42]],history:[]},loto7:{name:"ロト7",max:37,pick:7,bonusCount:2,base:BASE7,latest:[],latestBonus:[],recent:[],weights:{...WEIGHTS},purchased:[[1,6,11,16,21,26,31],[2,7,12,17,22,27,32],[3,8,13,18,23,28,33],[4,9,14,19,24,29,34],[5,10,15,20,25,30,35]],history:[]}};
let allState=JSON.parse(localStorage.getItem("loto67v21")||JSON.stringify(DEFAULTS)),game="loto6";const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];function S(){return allState[game]}function save(){localStorage.setItem("loto67v21",JSON.stringify(allState))}
$$('nav button').forEach(b=>b.onclick=()=>{$$('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('section').forEach(s=>s.classList.remove('active'));$('#'+b.dataset.tab).classList.add('active')});$('#switch6').onclick=()=>switchGame('loto6');$('#switch7').onclick=()=>switchGame('loto7');function switchGame(g){game=g;$('#switch6').classList.toggle('active',g==='loto6');$('#switch7').classList.toggle('active',g==='loto7');document.body.classList.toggle('loto7',g==='loto7');renderAll()}
function acValue(nums){let d=new Set();for(let i=0;i<nums.length;i++)for(let j=i+1;j<nums.length;j++)d.add(nums[j]-nums[i]);return d.size-(nums.length-1)}function scoreNumbers(){const s=S(),freq={};s.recent.flat().forEach(n=>freq[n]=(freq[n]||0)+1);const slide=new Set();s.latest.forEach(n=>{if(n>1)slide.add(n-1);if(n<s.max)slide.add(n+1)});const badj=new Set();s.latestBonus.forEach(b=>{if(b>1)badj.add(b-1);if(b<s.max)badj.add(b+1)});let out=[];for(let n=1;n<=s.max;n++){let v=s.base[n]??10;v+=(freq[n]||0)*s.weights.recent;if(slide.has(n))v+=s.weights.slide;if(s.latest.includes(n))v+=s.weights.previous;if(badj.has(n))v+=s.weights.bonusAdj;out.push({n,score:+v.toFixed(2)})}return out.sort((a,b)=>b.score-a.score)}
function combs(arr,k,start=0,p=[]){let r=[];if(p.length===k)return[p];for(let i=start;i<=arr.length-(k-p.length);i++)r=r.concat(combs(arr,k,i+1,p.concat(arr[i])));return r}function setScore(nums,map){const s=S();let v=nums.reduce((a,n)=>a+map[n],0),sum=nums.reduce((a,b)=>a+b,0),odd=nums.filter(n=>n%2).length,ac=acValue(nums),target=s.pick===6?125:133;v+=Math.max(0,8-Math.abs(sum-target)*.13)*s.weights.sum;v+=(odd>=2&&odd<=s.pick-2?3:-2)*s.weights.oddEven;v+=(ac>=4?2:-1.5)*s.weights.ac;return v}
function generate(){const s=S(),rank=scoreNumbers(),pool=rank.slice(0,s.pick===6?30:28).map(x=>x.n),map=Object.fromEntries(rank.map(x=>[x.n,x.score]));let cand=combs(pool,s.pick).map(x=>({nums:x.sort((a,b)=>a-b),score:setScore(x,map)})).sort((a,b)=>b.score-a.score),sel=[];for(let c of cand){if(sel.some(z=>z.nums.filter(n=>c.nums.includes(n)).length>(s.pick===6?2:3)))continue;sel.push(c);if(sel.length===5)break}s.purchased=sel.map(x=>x.nums);save();renderSets()}
function balls(nums){return`<div class="balls">${nums.map(n=>`<span class="ball">${String(n).padStart(2,'0')}</span>`).join('')}</div>`}function renderSets(){const s=S();$('#sets').innerHTML=s.purchased.map((nums,i)=>{let sum=nums.reduce((a,b)=>a+b,0),odd=nums.filter(n=>n%2).length,prev=nums.filter(n=>s.latest.includes(n)).length;return`<div class="set"><div class="set-head"><b>第${i+1}口</b><span class="badge">前回重複 ${prev}</span></div>${balls(nums)}<div class="muted">合計 ${sum} / 偶奇 ${odd}:${s.pick-odd} / AC ${acValue(nums)}</div></div>`}).join('')}
function parseNums(v){return v.split(/[,\s、・]+/).map(Number).filter(Boolean).sort((a,b)=>a-b)}function verify(){const s=S(),nums=parseNums($('#winningNums').value),bonus=parseNums($('#bonusNum').value),no=+$('#drawNo').value;if(nums.length!==s.pick||new Set(nums).size!==s.pick||nums.some(n=>n<1||n>s.max)){alert(`本数字を1～${s.max}の異なる${s.pick}個で入力してください`);return}if(bonus.length!==s.bonusCount||new Set(bonus).size!==s.bonusCount){alert(`ボーナス数字を${s.bonusCount}個入力してください`);return}let matches=s.purchased.map(x=>x.filter(n=>nums.includes(n)).length),highest=Math.max(...matches),prevOverlap=nums.filter(n=>s.latest.includes(n)).length,slide=new Set();s.latest.forEach(n=>{if(n>1)slide.add(n-1);if(n<s.max)slide.add(n+1)});let slideHits=nums.filter(n=>slide.has(n)).length,badjSet=new Set();s.latestBonus.forEach(b=>{if(b>1)badjSet.add(b-1);if(b<s.max)badjSet.add(b+1)});let badj=nums.filter(n=>badjSet.has(n)).length,sum=nums.reduce((a,b)=>a+b,0),ac=acValue(nums);$('#verifyResult').innerHTML=`<div class="card"><h3>照合結果</h3>${s.purchased.map((x,i)=>`<p>第${i+1}口：<b>${matches[i]}個一致</b>${balls(x.filter(n=>nums.includes(n)))}</p>`).join('')}<p class="${highest>=3?'good':'bad'}">最高一致：${highest}個</p><p>前回重複 ${prevOverlap} / ±1該当 ${slideHits} / B隣接 ${badj} / 合計 ${sum} / AC ${ac}</p></div>`;s.history.unshift({no,nums,bonus,highest,prevOverlap,slideHits,badj,sum,ac});s.latest=nums;s.latestBonus=bonus;s.recent.push(nums);s.recent=s.recent.slice(-30);save();renderHistory();renderRanking()}
function renderHistory(){const s=S();$('#historyBody').innerHTML=s.history.map(x=>`<tr><td>${x.no||'-'}</td><td>${x.highest}</td><td>${x.prevOverlap}</td><td>${x.slideHits}</td><td>${x.badj}</td><td>${x.sum}</td><td>${x.ac}</td></tr>`).join('')||'<tr><td colspan="7">履歴なし</td></tr>'}function renderRanking(){let r=scoreNumbers(),max=r[0].score;$('#rankingBody').innerHTML=r.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.n}</b></td><td>${x.score.toFixed(2)}</td><td><div class="rankbar"><i style="width:${x.score/max*100}%"></i></div></td></tr>`).join('')}
function renderSettings(){let labels={recent:'直近出現頻度',slide:'±1スライド',previous:'前回数字',bonusAdj:'ボーナス隣接',sum:'合計値',oddEven:'偶奇',ac:'AC値',diversity:'セット多様性'};$('#featureSettings').innerHTML=Object.entries(S().weights).map(([k,v])=>`<label>${labels[k]}：<span id="v-${k}">${v}</span></label><input type="range" min="0" max="3" step="0.1" value="${v}" data-weight="${k}">`).join('');$$('[data-weight]').forEach(x=>x.oninput=()=>$('#v-'+x.dataset.weight).textContent=x.value)}function renderAll(){const s=S();$('#homeTitle').textContent=s.name+' ダッシュボード';$('#predictTitle').textContent=s.name+' 次回予想5セット';$('#verifyTitle').textContent=s.name+' 抽選結果の検証';$('#rankingTitle').textContent=s.name+' 数字ランキング';$('#settingsTitle').textContent=s.name+' 特徴量設定';$('#kpiRange').textContent=`1～${s.max}`;$('#kpiPick').textContent=`${s.pick}個`;$('#kpiBonus').textContent=`${s.bonusCount}個`;$('#winningLabel').textContent=`本数字（${s.pick}個、カンマ区切り）`;$('#bonusLabel').textContent=`ボーナス数字（${s.bonusCount}個）`;$('#statusText').textContent=`${s.name}の予想・検証履歴・設定を独立保存しています。`;renderSets();renderHistory();renderRanking();renderSettings()}
$('#generateBtn').onclick=generate;$('#savePredictionBtn').onclick=()=>{save();alert('購入5セットとして保存しました')};$('#verifyBtn').onclick=verify;$('#saveSettingsBtn').onclick=()=>{$$('[data-weight]').forEach(x=>S().weights[x.dataset.weight]=+x.value);save();renderRanking();alert('設定を保存しました')};$('#resetBtn').onclick=()=>{if(confirm(S().name+'だけ初期設定に戻しますか？')){allState[game]=JSON.parse(JSON.stringify(DEFAULTS[game]));save();renderAll()}};$('#exportBtn').onclick=()=>{let b=new Blob([JSON.stringify(allState,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='loto6_loto7_ver2_1_data.json';a.click()};$('#importBtn').onclick=()=>{try{allState=JSON.parse($('#importText').value);save();renderAll();alert('読み込みました')}catch(e){alert('JSON形式を確認してください')}};renderAll();
</script></body></html>
